name: AgentGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run golden profile checks
        run: python tests/check_golden_profiles.py

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run pre-commit
        run: pre-commit run --all-files
